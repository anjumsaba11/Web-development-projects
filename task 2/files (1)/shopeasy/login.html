
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEasy - Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">ShopEasy</div>
    <button class="nav-toggle" id="navToggle">&#9776;</button>
    <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li class="cart-link"><a href="cart.html">Cart <span class="cart-count" id="cartCount">0</span></a></li>
        <span id="navAuthLinks"></span>
    </ul>
</nav>

<div class="form-container">
    <h2>Login</h2>
    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" required>
        </div>
        <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" required>
        </div>
        <button type="submit" class="btn">Login</button>
        <p class="form-msg" id="loginMsg"></p>
    </form>
    <p class="form-footer-text">Don't have an account? <a href="register.html">Register here</a></p>
</div>

<footer>
    <p>&copy; 2026 ShopEasy Mini Project. All rights reserved.</p>
    <p>Made by Saba | College Mini Project</p>
</footer>

<script src="js/script.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
