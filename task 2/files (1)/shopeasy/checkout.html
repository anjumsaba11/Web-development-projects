
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEasy - Checkout</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">ShopEasy</div>
    <button class="nav-toggle" id="navToggle">&#9776;</button>
    <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li class="cart-link"><a href="cart.html">Cart <span class="cart-count" id="cartCount">0</span></a></li>
        <span id="navAuthLinks"></span>
    </ul>
</nav>

<!-- Shipping details form (hidden after order is placed) -->
<div class="form-container" id="checkoutFormBox">
    <h2>Checkout</h2>
    <p style="text-align:center; margin-bottom:15px;">Order Total: Rs. <span id="checkoutTotal">0</span></p>

    <form id="checkoutForm" onsubmit="handleCheckout(event)">
        <div class="form-group">
            <label for="shipName">Full Name</label>
            <input type="text" id="shipName" required>
        </div>
        <div class="form-group">
            <label for="shipAddress">Address</label>
            <input type="text" id="shipAddress" required>
        </div>
        <div class="form-group">
            <label for="shipCity">City</label>
            <input type="text" id="shipCity" required>
        </div>
        <div class="form-group">
            <label for="shipPincode">Pincode</label>
            <input type="text" id="shipPincode" required>
        </div>
        <div class="form-group">
            <label for="shipPhone">Phone Number</label>
            <input type="text" id="shipPhone" required>
        </div>
        <div class="form-group">
            <label for="paymentMethod">Payment Method</label>
            <select id="paymentMethod">
                <option value="COD">Cash on Delivery</option>
                <option value="Card">Debit/Credit Card</option>
                <option value="UPI">UPI</option>
            </select>
        </div>
        <button type="submit" class="btn">Place Order</button>
    </form>
</div>

<!-- Order confirmation message (shown after placing order) -->
<div class="order-confirm" id="orderConfirmBox" style="display:none;">
    <h2>Order Placed Successfully!</h2>
    <p>Thank you for shopping with ShopEasy.</p>
    <p id="orderSummaryText"></p>
    <a href="index.html"><button class="btn" style="margin-top:15px;">Back to Home</button></a>
</div>

<footer>
    <p>&copy; 2026 ShopEasy Mini Project. All rights reserved.</p>
    <p>Made by Saba | College Mini Project</p>
</footer>

<script src="js/script.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script>
    // make sure the user is logged in before checking out
    requireLogin();

    // show the current cart total on the checkout page
    document.getElementById("checkoutTotal").innerText = getCartTotal();

    // if cart is empty, no point letting them checkout
    if (getCartItemCount() === 0) {
        document.getElementById("checkoutFormBox").innerHTML =
            "<h2>Checkout</h2><p style='text-align:center;'>Your cart is empty. <a href='products.html'>Go shopping</a></p>";
    }

    function handleCheckout(event) {
        event.preventDefault();

        var name = document.getElementById("shipName").value.trim();
        var total = getCartTotal();

        // In a real project the order would be sent to a server here.
        // For this project we just show a confirmation message.
        document.getElementById("checkoutFormBox").style.display = "none";
        document.getElementById("orderConfirmBox").style.display = "block";
        document.getElementById("orderSummaryText").innerText =
            "Order for " + name + " - Total Paid: Rs. " + total;

        clearCart(); // empty the cart after order is placed
    }
</script>
</body>
</html>
